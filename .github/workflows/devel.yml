name: Rebuild VCS packages

# A -git package's PKGBUILD pkgver is a placeholder; the real version comes from
# pkgver() at build time. ayaka plans from the static pkgver, so it never sees a
# VCS package as outdated and would never rebuild one. Force a periodic rebuild
# instead, the way Chaotic-AUR rebuilds its -git set.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect VCS packages
        id: collect
        run: |
          pkgs=$(find hayao -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | grep -E -- '-(bzr|cvs|darcs|git|hg|svn)$' | sort | tr '\n' ' ')
          echo "pkgs=${pkgs% }" >> "$GITHUB_OUTPUT"
          echo "Rebuilding: ${pkgs:-<none>}"
      # packages= is ayaka's force mode: it skips planning, which is the point —
      # planning is exactly what cannot detect a VCS update.
      - name: Dispatch build
        if: steps.collect.outputs.pkgs != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml -f packages="${{ steps.collect.outputs.pkgs }}"
